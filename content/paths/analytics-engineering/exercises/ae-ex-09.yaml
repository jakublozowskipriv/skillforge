id: ae-ex-09
title: Incremental — co gubi filtr naiwny, a co łapie lookback?
kind: sql
lesson: ae-03
topic: ae.materializations
difficulty: 3
question: |
  Symulujesz kolejny run modelu incremental na `raw.shipment_events`. Poprzedni run
  przetworzył wszystko, co zostało **załadowane** przed `2026-06-01 00:00:00` (watermark W).
  Wszystkie czasy są w UTC; `event_at` jest tekstem ISO-8601 (`2026-06-01T10:15:00Z`).

  Porównaj dwie strategie filtra nowego runu i policz (jeden wiersz, wiersze surowe — z duplikatami):

  | kolumna | znaczenie |
  |---|---|
  | `naive_reads` | ile wierszy przeczyta filtr naiwny `event_at >= W` |
  | `lookback_reads` | ile wierszy przeczyta filtr `loaded_at >= W - 3 dni` |
  | `late_missed_by_naive` | ile wierszy **nowych** (`loaded_at >= W`) filtr naiwny pominie, bo ich `event_at < W` |
hints:
  - "Zamień `event_at` na timestamp: `strptime(event_at, '%Y-%m-%dT%H:%M:%SZ')` (albo `cast(... as timestamp)`)."
  - "Trzy liczby w jednym przebiegu: `count(*) filter (where ...)` dla każdej kolumny."
  - "`late_missed_by_naive` to spóźnione eventy: dotarły po watermarku, ale wydarzyły się przed nim. Dokładnie przez nie model filtruje po `loaded_at`."
reference: |
  with events as (
      select
          strptime(event_at, '%Y-%m-%dT%H:%M:%SZ') as event_ts,
          loaded_at
      from raw.shipment_events
  )

  select
      count(*) filter (where event_ts >= timestamp '2026-06-01') as naive_reads,
      count(*) filter (
          where loaded_at >= timestamp '2026-06-01' - interval 3 day
      ) as lookback_reads,
      count(*) filter (
          where loaded_at >= timestamp '2026-06-01' and event_ts < timestamp '2026-06-01'
      ) as late_missed_by_naive
  from events
negatives:
  # lookback liczony po event_at zamiast po loaded_at
  - |
    with events as (
        select strptime(event_at, '%Y-%m-%dT%H:%M:%SZ') as event_ts, loaded_at
        from raw.shipment_events
    )
    select
        count(*) filter (where event_ts >= timestamp '2026-06-01') as naive_reads,
        count(*) filter (where event_ts >= timestamp '2026-06-01' - interval 3 day) as lookback_reads,
        count(*) filter (where loaded_at >= timestamp '2026-06-01'
                         and event_ts < timestamp '2026-06-01') as late_missed_by_naive
    from events
