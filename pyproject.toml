[project]
name = "skillforge"
version = "0.1.0"
description = "Local learning app for Analytics Engineering + AI for analytics: lessons, auto-graded exercises (golden set evaluator), spaced repetition and progress tracking."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "duckdb>=1.2",
    "fsrs>=6.0",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "streamlit>=1.45",
    "typer>=0.15",
]

[project.scripts]
skillforge = "skillforge.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the generated warehouse (slower)",
]
