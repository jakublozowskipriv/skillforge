name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build warehouse (full scale, dbt build with tests)
        run: uv run skillforge data build
      - name: Validate golden set (references reproduce snapshots)
        run: uv run skillforge content validate
